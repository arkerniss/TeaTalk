<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="茶室">
  <link rel="icon" href="data:,">
  <title>茶室</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="exit-btn" class="icon-btn exit hidden" aria-label="退出房间" title="退出房间">←</button>
      <div class="brand">
        <span class="brand-name">茶室</span>
        <span id="room-name" class="room-name"></span>
      </div>
      <button id="users-btn" class="users-btn" aria-label="在线用户">
        <span class="users-dot" aria-hidden="true"></span>
        <span id="user-count">0</span>
      </button>
      <button id="menu-btn" class="icon-btn menu-btn" aria-label="更多" title="更多">⋯</button>
    </header>

    <div id="conn-banner" class="banner hidden" role="status"></div>

    <main id="messages" aria-live="polite"></main>

    <button id="new-msg-btn" class="new-msg hidden">新消息 ↓</button>

    <form id="composer" autocomplete="off">
      <button type="button" id="attach-btn" class="icon-btn attach" aria-label="发送文件" title="发送文件">＋</button>
      <input id="file-input" type="file" multiple hidden>
      <textarea id="text-input" rows="1" maxlength="4000" placeholder="说点什么…" aria-label="消息输入框"></textarea>
      <button type="submit" id="send-btn" class="send-btn" aria-label="发送">发送</button>
    </form>

    <section id="join-panel" class="join-panel" aria-label="加入房间">
      <div class="join-card">
        <div class="join-mark" aria-hidden="true">
          <span class="bubble bubble-a"></span>
          <span class="bubble bubble-b"></span>
        </div>
        <h1>茶室</h1>
        <p class="tagline">同一片 Wi-Fi，慢慢聊。</p>
        <label for="name-input">给自己起个名字</label>
        <input id="name-input" maxlength="20" placeholder="例如：柚子" autocomplete="nickname">
        <button type="button" id="join-btn">进入房间</button>
        <p id="join-error" class="error"></p>
        <p class="privacy-note">局域网内明文传输，请只在可信网络使用。</p>
      </div>
    </section>

    <div id="users-sheet" class="sheet-wrap hidden" aria-label="在线用户">
      <div class="sheet-backdrop" data-close="users"></div>
      <div class="sheet">
        <div class="sheet-head">
          <span>在线的人</span>
          <button type="button" class="icon-btn" data-close="users" aria-label="关闭">×</button>
        </div>
        <ul id="users-list"></ul>
      </div>
    </div>

    <div id="menu-sheet" class="sheet-wrap hidden" aria-label="更多功能">
      <div class="sheet-backdrop" data-close="menu"></div>
      <div class="sheet menu-sheet">
        <div class="sheet-head">
          <span>更多</span>
          <button type="button" class="icon-btn" data-close="menu" aria-label="关闭">×</button>
        </div>
        <div class="menu-list">
          <button type="button" id="menu-files" class="menu-item">
            <span class="menu-icon" aria-hidden="true">🗂</span>
            <span class="menu-copy"><strong>文件</strong><small>7 天历史文件 · 右滑可延期</small></span>
            <span class="menu-chevron" aria-hidden="true">›</span>
          </button>
          <button type="button" id="menu-clear" class="menu-item danger">
            <span class="menu-icon" aria-hidden="true">🧹</span>
            <span class="menu-copy"><strong>清除聊天记录</strong><small>只清聊天，文件仍保留</small></span>
            <span class="menu-chevron" aria-hidden="true">›</span>
          </button>
        </div>
      </div>
    </div>

    <section id="files-view" class="files-view hidden" aria-label="文件">
      <header class="files-head">
        <button type="button" id="files-back" class="icon-btn" aria-label="返回">←</button>
        <div class="files-title">
          <strong>文件</strong>
          <span>保留 7 天 · 右滑可延期</span>
        </div>
        <button type="button" id="files-refresh" class="icon-btn" aria-label="刷新">↻</button>
      </header>
      <div id="files-list" class="files-list"></div>
    </section>

    <div id="clear-dialog" class="modal-wrap hidden" role="dialog" aria-modal="true" aria-label="清除聊天记录">
      <div class="modal-backdrop" data-close="clear"></div>
      <div class="modal-card">
        <h2>清除聊天记录？</h2>
        <p>聊天里的文字和文件卡片会清空；文件仍保留在「文件」里，7 天内可下载或延期。</p>
        <div class="modal-actions">
          <button type="button" class="modal-cancel" data-close="clear">取消</button>
          <button type="button" id="clear-confirm" class="modal-confirm">清除</button>
        </div>
      </div>
    </div>

    <div id="lightbox" class="lightbox hidden" role="dialog" aria-label="图片预览">
      <div class="lightbox-backdrop" data-close="lightbox"></div>
      <div class="lightbox-body">
        <img id="lightbox-img" alt="">
        <a id="lightbox-download" class="lightbox-download" download>下载原图</a>
        <button type="button" class="icon-btn lightbox-close" data-close="lightbox" aria-label="关闭">×</button>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>
  <noscript>茶室需要 JavaScript，请在浏览器设置中开启。</noscript>
  <script src="/app.js"></script>
</body>
</html>
